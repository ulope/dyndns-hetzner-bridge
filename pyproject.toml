[project]
name = "dyndns-hetzner-bridge"
version = "0.1.0"
description = "Bridge that translates dyndns2 update requests into Hetzner Cloud DNS API calls"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx2>=2.16",
    "starlette>=1.0",
    "uvicorn>=0.34",
]
classifiers = [
    "Framework :: AsyncIO",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: Name Service (DNS)",
]

[project.scripts]
dyndns-hetzner-bridge = "dyndns_hetzner_bridge.__main__:main"

[dependency-groups]
dev = [
    "mypy>=1.15",
    "pytest>=8.3",
    "ruff>=0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dyndns_hetzner_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
strict = true
files = ["src", "tests"]
